<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>心率 · 大字</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:transparent; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/live.js"></script>
<script>
/* 极简版：一个大号像素心率数字 + 一颗跟着跳的心，透明背景 */

const PAL = { cool:'#3ad6c8', hot:'#ffb03a', danger:'#ff2f2f', dim:'#6b7787', heart:'#ff5a3c' };
const FONT = {
  '0':['111','101','101','101','111'], '1':['010','110','010','010','111'],
  '2':['111','001','111','100','111'], '3':['111','001','111','001','111'],
  '4':['101','101','111','001','001'], '5':['111','100','111','001','111'],
  '6':['111','100','111','101','111'], '7':['111','001','001','001','001'],
  '8':['111','101','111','101','111'], '9':['111','101','111','001','111'],
  '-':['000','000','111','000','000'], ' ':['000','000','000','000','000'],
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W=0, H=0, dpr=1;

function fit() {
  const r = canvas.getBoundingClientRect();
  W = Math.max(60, r.width); H = Math.max(30, r.height);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fit);

function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function textW(t,d){ return String(t).length*4*d - d; }
function pixelText(x,y,t,d,c){
  let cx=x;
  for(const ch of String(t)){
    const g=FONT[ch]||FONT[' '];
    for(let r=0;r<5;r++) for(let cc=0;cc<3;cc++)
      if(g[r][cc]==='1') px(cx+cc*d, y+r*d, d, d, c);
    cx+=4*d;
  }
}

let state = { bpm:null, zone:'idle' };
HRLive.subscribe(snap => {state = snap.connected ? snap : {...snap,bpm:null,zone:'idle'};});

let phase = 0, last = performance.now();

function frame(now){
  const dt = Math.min(0.1,(now-last)/1000); last = now;
  const bpm = state.bpm;
  if (bpm) phase = (phase + (bpm/60)*dt) % 1; else phase = (phase + 0.15*dt) % 1;

  ctx.clearRect(0,0,W,H);
  const zone = state.zone||'idle';
  const col = !bpm ? PAL.dim : zone==='danger' ? PAL.danger : zone==='warn' ? PAL.hot : PAL.cool;

  // 数字大小自适应
  const txt = bpm ? String(Math.round(bpm)) : '--';
  const dot = Math.max(2, Math.floor(Math.min((H*0.62)/5, (W*0.62)/(4*txt.length))));
  const tw = textW(txt, dot);

  // 心形图标（像素）
  const heartSize = Math.max(2, Math.round(dot*0.9));
  const beat = Math.abs(Math.sin(phase*Math.PI*2));
  const hs = 1 + beat*0.22;
  const heartW = 7*heartSize*hs;
  const gap = dot*2.2;
  const startX = (W - (tw + gap + heartW))/2;
  const baseY = (H - 5*dot)/2;

  // 心（7x6 像素，两瓣）
  const HX = startX, HY = baseY + 5*dot/2 - 3*heartSize*hs;
  const cells = [
    [1,0],[2,0],[4,0],[5,0],
    [0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],
    [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[6,2],
    [1,3],[2,3],[3,3],[4,3],[5,3],
    [2,4],[3,4],[4,4],
    [3,5],
  ];
  const hcol = bpm ? PAL.heart : PAL.dim;
  for(const [cx,cy] of cells) px(HX+cx*heartSize*hs, HY+cy*heartSize*hs, heartSize*hs, heartSize*hs, hcol);

  pixelText(startX + heartW + gap, baseY, txt, dot, col);

  // 危险时整体闪一下
  if (zone==='danger' && beat>0.9) ctx.clearRect(0,0,W,H), pixelText(startX+heartW+gap, baseY, txt, dot, '#ffffff');

  requestAnimationFrame(frame);
}
fit();
requestAnimationFrame(frame);
</script>
</body>
</html>
