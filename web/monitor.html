<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>心率台 · 咸鱼突刺</title>
<link rel="stylesheet" href="/theme.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }

  /* ---------- 顶栏：只留品牌 + 次要入口 ---------- */
  .bar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 22px; box-shadow: inset 0 -1px 0 var(--edge-soft);
  }
  .bar .who { font: 600 13px/1 var(--ui); letter-spacing: .16em; color: var(--bone); }
  .bar .who b { color: var(--tangerine); }
  .bar .spacer { flex: 1; }
  .bar a { font-size: 11px; color: var(--ash); letter-spacing: .08em; }
  .bar a:hover { color: var(--tangerine); }

  /* ---------- 主体：示波区 ---------- */
  .scope {
    position: relative;
    flex: 1;
    min-height: 300px;
    margin: 16px 22px 0;
    box-shadow: inset 0 0 0 1px var(--edge-soft);
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* 右上角读数 */
  .readout {
    position: absolute; top: 16px; right: 18px;
    text-align: right; pointer-events: none;
  }
  .readout .v {
    font: 700 52px/0.9 var(--num); letter-spacing: -.02em;
    color: var(--jade); text-shadow: 0 0 26px rgba(58, 214, 200, .35);
    transition: color .5s;
  }
  .readout .u { font: 10px/1 var(--num); letter-spacing: .28em; color: var(--ash); margin-top: 7px; }

  /* 左上角状态 */
  .badge {
    position: absolute; top: 16px; left: 18px;
    font: 11px/1 var(--num); letter-spacing: .1em; color: var(--bone-dim);
    display: flex; align-items: center; gap: 7px;
  }

  /* ---------- 锚点尺：四个刻度，颜色对应色带 ---------- */
  .ruler {
    display: grid; grid-template-columns: repeat(4, 1fr);
    margin: 0 22px; box-shadow: inset 0 0 0 1px var(--edge-soft);
  }
  .tick {
    padding: 11px 14px 13px; position: relative;
    background: var(--ink-2);
    border-right: 1px solid var(--edge-soft);
  }
  .tick:last-child { border-right: 0; }
  .tick::after {                    /* 底部色条 = 该锚点在波形里的颜色 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
  }
  .tick.b::after { background: var(--bone); }
  .tick.y::after { background: var(--gold); }
  .tick.o::after { background: var(--tangerine); }
  .tick.r::after { background: var(--ember); }
  .tick .k { font: 10px/1 var(--num); letter-spacing: .16em; color: var(--ash); }
  .tick .n { font: 600 24px/1 var(--num); margin-top: 7px; }
  .tick.b .n { color: var(--bone); }
  .tick.y .n { color: var(--gold); }
  .tick.o .n { color: var(--tangerine); }
  .tick.r .n { color: var(--ember); }
  .tick .d { font: 10px/1.5 var(--ui); color: var(--ash); margin-top: 5px; }

  /* ---------- 底栏：服务 + 统计 + 操作 ---------- */
  .foot {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 14px 22px 18px;
  }
  .foot .stat { font: 11px/1.9 var(--num); color: var(--ash); }
  .foot .stat b { color: var(--bone); }
  .foot .spacer { flex: 1; }
  .foot .acts { display: flex; gap: 7px; }

  /* ---------- 抽屉：记录 ---------- */
  details {
    margin: 0 22px 22px;
    background: var(--ink-2); box-shadow: inset 0 0 0 1px var(--edge-soft);
  }
  summary {
    cursor: pointer; padding: 11px 16px; list-style: none;
    font: 600 11px/1 var(--num); letter-spacing: .16em; color: var(--ash);
    text-transform: uppercase;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "▸ "; color: var(--tangerine); }
  details[open] summary::before { content: "▾ "; }
  summary:hover { color: var(--bone); }
  .drawer-body { padding: 0 16px 16px; }
  tr.pick { cursor: pointer; }

  @media (max-width: 720px) {
    .ruler { grid-template-columns: repeat(2, 1fr); }
    .readout .v { font-size: 38px; }
  }
</style>
<link rel="stylesheet" href="/studio-theme.css">
</head>
<body class="studio-tool">

<div class="bar">
  <span class="who"><b>🐟</b> 心率台</span>
  <span class="spacer"></span>
  <a href="/console">返回开播工作台</a>
  <a href="/">直播页</a>
  <a href="/tune">调参</a>
  <a href="/plain">极简</a>
  <a href="/hr" target="_blank">数据</a>
  <select id="skinSel" onchange="setSkin()" title="切换皮肤"
          style="background:#1e242e;color:var(--bone);border:0;padding:5px 9px;
                 box-shadow:inset 0 0 0 1px var(--edge);font:12px var(--ui);cursor:pointer">
    <option value="fish">咸鱼</option>
    <option value="ghost">幽灵</option>
    <option value="xianyu">咸鱼突刺</option>
  </select>
</div>

<!-- 示波区：波形在中间，背景是四个强度色带 -->
<section class="scope cut">
  <canvas id="wave"></canvas>
  <div class="badge"><span class="dot" id="dot"></span><span id="conn">读取中…</span></div>
  <div class="readout">
    <div class="v" id="bpmv">---</div>
    <div class="u" id="zone">BPM</div>
  </div>
</section>

<!-- 锚点尺 -->
<div class="ruler cut" id="ruler">
  <div class="tick b"><div class="k">基准 B</div><div class="n" id="aB">--</div><div class="d">开播锁定的平静心率</div></div>
  <div class="tick y"><div class="k">黄</div><div class="n" id="aY">--</div><div class="d">B + (R−B)×40%</div></div>
  <div class="tick o"><div class="k">橙</div><div class="n" id="aO">--</div><div class="d">B + (R−B)×70%</div></div>
  <div class="tick r"><div class="k">满红 R</div><div class="n" id="aR">--</div><div class="d">clamp(P90−3, B+minGap, B+maxGap)</div></div>
</div>

<div class="foot">
  <div class="stat" id="stats">本场 — / — / —</div>
  <div class="stat" id="burst">特效 —</div>
  <div class="spacer"></div>
  <div class="acts">
    <button class="btn jade" onclick="calibrate()">我现在很平静，校准基准</button>
    <button class="btn ghost" onclick="resetStats()">重置本场统计</button>
  </div>
</div>

<details>
  <summary>历史记录 · 按游戏时段回放</summary>
  <div class="drawer-body">
    <label class="hint" for="logActivity">记录类型：</label><select id="logActivity"><option value="all">全部</option><option value="game">游戏</option><option value="non_game">非游戏</option><option value="unmarked">未标注（含旧记录）</option></select><button class="btn ghost" id="refreshLogs">刷新列表</button>
    <p class="hint">每次标记切换独立成段，避免回放混入日常数据。旧记录没有标签，均归入未标注。以下指标为算法回放估计，不能代替人工判断真实误报。</p>
    <table>
      <thead><tr>
        <th>记录</th><th class="num">样本</th><th class="num">时长</th>
        <th class="num">满红/10min</th><th class="num">假红</th>
        <th class="num">特效/10min</th><th>判读</th>
      </tr></thead>
      <tbody id="logs"><tr><td colspan="7" class="hint">读取中…</td></tr></tbody>
    </table>
    <p class="hint" id="replayNote" style="margin:12px 0 0"></p>
  </div>
</details>

<script src="/live.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const cv = $('wave');
const ctx = cv.getContext('2d');
let hist = [];          // [[t, bpm], ...]
let anchorsNow = null;  // {B, Y, O, R}
let lastBurst = 0;

const BANDS = [
  { from: 'lo',  to: 'B', color: 'rgba(232,230,223,.020)' },   // 白区：几乎看不出
  { from: 'B',   to: 'Y', color: 'rgba(255,209,102,.045)' },   // 黄区
  { from: 'Y',   to: 'O', color: 'rgba(255,138,92,.065)' },    // 橙区
  { from: 'O',   to: 'R', color: 'rgba(255,59,48,.095)' },     // 红区
  { from: 'R',   to: 'hi', color: 'rgba(255,59,48,.17)' },     // 破阈值
];

function anchorValues() {
  const p = window.__params || { minGap: 22, maxGap: 30, p90Offset: 3 };
  const hr = window.__hr || {};
  const s = hr.stats || {}, rc = hr.recent || {};
  let B = hr.base;
  if (B == null) B = 70;
  const p90 = rc.p90 != null ? rc.p90 : B + p.minGap;
  const R = Math.min(B + p.maxGap, Math.max(B + p.minGap, p90 - p.p90Offset));
  return { B, Y: B + (R - B) * (p.yellowAt??.4), O: B + (R - B) * (p.orangeAt??.7), R, p90 };
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const A = anchorsNow || anchorValues();
  const vals = hist.map((d) => d[1]);
  const lo = Math.min(...(vals.length ? vals : [A.B]), A.B) - 4;
  const hi = Math.max(...(vals.length ? vals : [A.R]), A.R) + 5;
  const span = Math.max(12, hi - lo);
  const yOf = (v) => H - ((v - lo) / span) * H;

  // ---- 强度色带（这就是界面的骨架：不用读数字也知道自己在哪一档）----
  const pts = { lo, B: A.B, Y: A.Y, O: A.O, R: A.R, hi };
  for (const band of BANDS) {
    const y0 = yOf(pts[band.to]), y1 = yOf(pts[band.from]);
    ctx.fillStyle = band.color;
    ctx.fillRect(0, Math.min(y0, y1), W, Math.abs(y1 - y0));
  }
  // 锚点分界线
  ctx.save();
  ctx.setLineDash([4, 5]);
  for (const [v, col] of [[A.B, 'rgba(232,230,223,.28)'], [A.Y, 'rgba(255,209,102,.35)'],
                          [A.O, 'rgba(255,138,92,.4)'], [A.R, 'rgba(255,59,48,.55)']]) {
    const y = yOf(v);
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  // 刻度值
  ctx.font = '10px "Cascadia Mono", Consolas, monospace';
  for (const [v, col] of [[A.B, 'rgba(232,230,223,.5)'], [A.R, 'rgba(255,90,60,.75)']]) {
    ctx.fillStyle = col;
    ctx.fillText(String(Math.round(v)), 6, yOf(v) - 4);
  }

  // ---- 网格（纵向，每 1/8 宽）----
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  for (let i = 1; i < 8; i++) {
    const x = (W / 8) * i;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  if (hist.length < 2) return;

  // ---- 波形 ----
  const t0 = hist[0][0], t1 = hist[hist.length - 1][0];
  const cyc = Math.max(1, t1 - t0);
  ctx.beginPath();
  hist.forEach(([t, v], i) => {
    const x = ((t - t0) / cyc) * W;
    const y = yOf(v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = 'rgba(255,59,48,.9)';
  ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
  // 发光
  ctx.strokeStyle = 'rgba(255,59,48,.18)';
  ctx.lineWidth = 7; ctx.stroke();

  // ---- 当前值游标 ----
  const cur = window.__hr && window.__hr.bpm;
  if (cur != null) {
    const y = yOf(cur);
    const x = W - 1;
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 5, y - 5, 10, 10);
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(x - 7, y); ctx.stroke();
  }
}

function fmtTime(ts) {
  const d = new Date(ts * 1000), p = (n) => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let liveSnapshot = {};
async function refresh(snapshot=liveSnapshot) {
  try {
    const hr = snapshot, hs = hr.history || {}, ps = hr.params || {};
    window.__hr = hr; window.__params = ps;
    hist = (hs.samples || []).map((d) => [d[0], d[1]]);
    anchorsNow = anchorValues();

    const bpm = hr.bpm, age = hr.age;
    const offline = !hr.connected || (age != null && age > (ps.offlineAfter??5));
    const a = anchorsNow;

    $('bpmv').textContent = bpm == null ? '---' : bpm;
    $('bpmv').style.color = bpm == null ? 'var(--ash)'
                           : (offline ? 'var(--ember)' : 'var(--jade)');
    $('bpmv').style.textShadow = offline ? '0 0 26px rgba(255,59,48,.4)'
                                         : '0 0 26px rgba(58,214,200,.35)';
    $('zone').textContent = bpm == null ? 'BPM'
      : (bpm >= a.R ? '满红' : bpm >= a.O ? '红温' : bpm >= a.Y ? '上头' : bpm >= a.B ? '发力' : 'BPM');
    $('dot').className = 'dot ' + (bpm != null && !offline ? 'on' : 'off');
    $('conn').textContent = offline ? '离线 · 手环没在广播？' : '已连接';

    $('aB').textContent = a.B.toFixed(0);
    $('aY').textContent = a.Y.toFixed(0);
    $('aO').textContent = a.O.toFixed(0);
    $('aR').textContent = a.R.toFixed(0);

    const s = hr.stats || {}, rc = hr.recent || {};
    $('stats').innerHTML = `本场 <b>${s.min ?? '—'}</b> / <b>${s.avg ?? '—'}</b> / <b>${s.max ?? '—'}</b>` +
                           `　·　10分P90 <b>${rc.p90 ?? '—'}</b>　·　电量 <b>${hr.battery ?? '—'}%</b>`;
    $('burst').textContent = `基准 ${hr.base==null?'预热':'P25慢跟随'} · P25 ${hr.baseline?.p25??'—'} / Δ ${hr.baseline?.delta??'—'} ${hr.baseline?.warning||''} · 配置 v${hr.params_version??'—'}`;
    if (ps.skin) $('skinSel').value=ps.skin;
  } catch (_) {
    $('conn').textContent = '服务未连接';
    $('dot').className = 'dot off';
  }
  draw();
}

async function calibrate() {
  try {
    const r = await (await fetch('/calibrate', { method: 'POST' })).json();
    if(!r.ok){alert(r.message);return;}
    $('burst').textContent = r.message;
    refresh();
  } catch (_) { alert('校准失败：服务没在运行？'); }
}

async function setSkin() {
  const v = $('skinSel').value;
  try {
    await fetch('/params', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ skin: v }),
    });
    $('burst').innerHTML = `皮肤已切换 <b>${v === 'ghost' ? '幽灵' : (v === 'xianyu' ? '咸鱼突刺' : '咸鱼')}</b>`;
    // 让下面的预览立刻跟着换
    const prev = document.getElementById('prev');
    if (prev && !prev.src.endsWith('/?bg=1')) prev.src = '/?bg=1';
  } catch (e) { alert('切换失败：' + e); }
}

async function loadSkin() {
  try {
    const p = await (await fetch('/params')).json();
    $('skinSel').value = p.skin || 'fish';
  } catch (_) {}
}

async function resetStats() {
  if (!confirm('重置本场统计？（记录文件不受影响）')) return;
  try { await fetch('/reset', { method: 'POST' }); refresh(); } catch (_) {}
}

let logsRequest=0;
async function loadLogs() {
  const tb=$('logs'),request=++logsRequest;
  tb.replaceChildren();
  try {
    const response=await fetch('/logs?activity='+encodeURIComponent($('logActivity').value));
    const list=await response.json();
    if(request!==logsRequest)return;
    if(!response.ok)throw Error(list.error||'读取失败');
    if(!list.length){tb.textContent='该类型暂无记录';return;}
    const labels={game:'游戏',non_game:'非游戏',unmarked:'未标注'};
    for(const it of list){
      const tr=document.createElement('tr');tr.className='pick';tr.dataset.name=it.name;
      for(const value of [fmtTime(it.mtime)+' · '+(labels[it.activity]||'未标注')+(it.game?' · '+it.game:''),it.samples]){
        const td=document.createElement('td');td.className='num';td.textContent=value;tr.append(td);
      }
      for(const role of ['dur','red','fr','burst','verdict']){
        const td=document.createElement('td');td.dataset.role=role;td.className=role==='verdict'?'hint':'num';td.textContent=role==='verdict'?'点击回放':'—';tr.append(td);
      }
      tr.addEventListener('click',()=>replay(tr));tb.append(tr);
    }
  }catch(e){if(request===logsRequest)tb.textContent='读取失败：'+e.message;}
}
$('logActivity').addEventListener('change',()=>{ $('replayNote').textContent='';loadLogs(); });
$('refreshLogs').addEventListener('click',loadLogs);

async function replay(tr) {
  const name = tr.dataset.name;
  const cell = (r) => tr.querySelector('[data-role=' + r + ']');
  $('replayNote').textContent = '回放中…';
  try {
    const r = await (await fetch('/replay?file=' + encodeURIComponent(name))).json();
    if (r.error) { $('replayNote').textContent = '回放失败：' + r.error; return; }
    cell('dur').textContent = r.minutes + 'min';
    cell('red').textContent = r.red_per10.toFixed(1);
    cell('fr').textContent = r.false_red;
    cell('burst').textContent = r.burst_per10.toFixed(1);
    let v, c;
    if (r.false_red > 0)        { v = '有假红 → 提高 minGap'; c = 'bad'; }
    else if (r.red_per10 < 0.3) { v = '几乎不红 → 可降 minGap'; c = 'mid'; }
    else if (r.red_per10 <= 3)  { v = '甜点'; c = 'good'; }
    else                        { v = '红过头 → 提高 minGap'; c = 'mid'; }
    cell('verdict').innerHTML = `<span class="tag ${c}">${v}</span>`;
    $('replayNote').textContent =
      `${r.file} · ${r.samples} 样本 / ${r.minutes} 分钟 · 心率 ${r.min}/${r.avg}/${r.max}` +
      ` · 锚点 B=${r.anchorB} R=${r.anchorR} · 满红 ${r.red} 次、假红估计 ${r.false_red} 次、` +
      `特效 ${r.burst} 次`;
  } catch (e) { $('replayNote').textContent = '回放出错：' + e; }
}

addEventListener('resize', draw);
HRLive.subscribe(snap=>{liveSnapshot=snap;refresh(snap)}); loadLogs();

// ?noiframe=1 → 隐藏预览（想要纯数据视图，或截图时用）
if (new URLSearchParams(location.search).has('noiframe')) {
  const pv = document.getElementById('prev');
  if (pv) pv.closest('section').remove();
}

</script>
</body>
</html>
