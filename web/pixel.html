<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>fish-heart-hit</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:transparent; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =========================================================
   fish-heart-hit · 八状态角色 / 绝对分档 / SSE 配置同步
   只有三样东西：红色心率线（横穿画面中央）、像素咸鱼、心率数字；爆发时增加突刺反馈
   没有背景框、没有统计、没有电量 —— 方便直接叠在游戏画面上
   ========================================================= */

const PAL = {
  body:   '#e8e6df',
  bodyHi: '#ffffff',
  shade:  '#9aa3ad',
  line:   '#2b2f36',
  fin:    '#ff8a5c',
  trace:  '#ff3b30',   // 心率线：红
  traceDim:'#a01f18',
  cool:   '#3ad6c8',
  hot:    '#ffb03a',
  danger: '#ff2f2f',
  dim:    '#6b7787',
};

const FONT = {
  '0':['111','101','101','101','111'], '1':['010','110','010','010','111'],
  '2':['111','001','111','100','111'], '3':['111','001','111','001','111'],
  '4':['101','101','111','001','001'], '5':['111','100','111','001','111'],
  '6':['111','100','111','101','111'], '7':['111','001','001','001','001'],
  '8':['111','101','111','101','111'], '9':['111','101','111','001','111'],
  '-':['000','000','111','000','000'], ' ':['000','000','000','000','000'],
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1;

const params = new URLSearchParams(location.search);
const SCALE = parseFloat(params.get('s') || '1');
const PREVIEW = params.get('preview') === '1';
const HUD_PREVIEW = params.get('hudPreview') === '1' && (PREVIEW || params.get('demo') === '1');
let previewDraft = null;
const PREVIEW_BG = params.get('bg') === '1';   // 预览用：铺一层深色底（方便在浅色页面上看效果）

function fitCanvas() {
  const rect = canvas.getBoundingClientRect();
  W = Math.max(160, Math.round(rect.width));
  H = Math.max(60, Math.round(rect.height));
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', fitCanvas);

function px(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

/* ---------- 心率 → 颜色（连续渐变，不是跳档） ---------- */

function mixColor(c1, c2, k) {
  k = Math.max(0, Math.min(1, k));
  const a = [1, 3, 5].map(i => parseInt(c1.substr(i, 2), 16));
  const b = [1, 3, 5].map(i => parseInt(c2.substr(i, 2), 16));
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * k).toString(16).padStart(2, '0')).join('');
}

/* =========================================================
   冻结版算法（之后只做参数校准，不再改结构）

   ┌ 颜色映射：个人基线 B ＋ 最近 10 分钟 P90 动态阈值
   ├ 防假红 ：R ≥ B + 22
   ├ 防抗红 ：R ≤ B + 30
   ├ 慢更新 ：阈值按 15 秒时间常数缓慢跟随
   ├ 视觉   ：强度做 Attack(2s) / Release(6s)
   ├ 迟滞   ：连续 ≥ R 两秒才算满红，回落到 R−5 以下解除
   ├ 离线   ：超过 5 秒没有新数据 → 显示离线，不沿用旧心率
   └ 特效   ：30 秒内上涨 ≥8 bpm 且高于 B+10 → 触发一次，冷却 30 秒

   数据本身不做任何滤波（手表读数可靠），只有"画面"做缓动。
   ========================================================= */

const P = {
  baseFallback: 70,   // 攒够数据前的基线兜底
  minGap: 22,         // R ≥ B + 22   防假红（实测甜点：满红 1.2 次/10min、假红 0）
  maxGap: 30,         // R ≤ B + 30   防抗红（原来 45，实测让 R 顶到 114 而本人峰值才 104）
  p90Offset: 3,       // R = P90 − 3
  yellowAt: 0.4,      // 黄锚在 B→R 区间的位置（可在调参面板拖动）
  orangeAt: 0.7,      // 橙锚位置
  anchorTau: 15,      // 阈值慢更新时间常数（秒）
  attack: 2.0,        // 上色时间常数（秒）
  release: 6.0,       // 褪色时间常数（秒）
  redHold: 2.0,       // 连续达阈值多久算满红
  redDrop: 5,         // 回落多少解除满红
  offlineAfter: 5,    // 多久没数据算离线
  burstRise: 8,      // 窗口内涨多少触发特效
  burstAbove: 10,     // 且要高于基线多少
  burstWindow: 30,    // 涨幅观察窗口（秒）
  burstCooldown: 30,  // 特效冷却（秒）
  fishScale: 1.0,     // 仅新皮肤的角色大小，网页控制台可调整
  fishWidth: 1.5,     // 用户选定的默认素材横向比例；不改变窗口和数字
  fxWarmth: true, fxKick: true,
  traceLayout: 'overlay',
};

/* 调参入口：URL 参数覆盖 + 来自调校面板的 postMessage（改完即时生效，不用刷新）
   例如  /?minGap=22&burstRise=8                                     */
const TUNABLE = ['minGap', 'maxGap', 'p90Offset', 'yellowAt', 'orangeAt', 'anchorTau',
                 'attack', 'release', 'redHold', 'redDrop', 'offlineAfter', 'burstRise',
                 'burstAbove', 'burstWindow', 'burstCooldown', 'fishScale', 'fishWidth'];
function applyUrlParams() {
  TUNABLE.forEach(k => {
    const v = parseFloat(params.get(k));
    if (!isNaN(v)) P[k] = v;
  });
  const sk = params.get('skin');           // 皮肤是字符串，单独处理
  if (sk && SKINS_ALLOWED.includes(sk)) P.skin = sk;
  const layout = params.get('traceLayout');
  if (['overlay','lower'].includes(layout)) P.traceLayout = layout;
  for (const [key, name] of [['fxWarmth','warmth'],['fxKick','kick']]) {
    if (params.has(key)) XIANYU_FX[name] = !['0','false'].includes(params.get(key));
  }
}
const SKINS_ALLOWED = ['fish','ghost','xianyu'];
P.skin = 'fish';

// Snapshots are authoritative; explicit URL overrides remain highest priority.
function receiveParams(p) {
  if (!p || typeof p !== 'object') return;
  if (typeof state !== 'undefined') { if(p.warn!=null)state.warn=p.warn;if(p.danger!=null)state.danger=p.danger; }
  for (const key of TUNABLE) if (Number.isFinite(p[key])) P[key] = p[key];
  if (SKINS_ALLOWED.includes(p.skin)) P.skin = p.skin;
  if (['overlay','lower'].includes(p.traceLayout)) P.traceLayout = p.traceLayout;
  if (typeof p.fxWarmth === 'boolean') XIANYU_FX.warmth = p.fxWarmth;
  if (typeof p.fxKick === 'boolean') XIANYU_FX.kick = p.fxKick;
  applyUrlParams();
}
window.addEventListener('message', ev => {
  if (ev.origin !== location.origin || ev.source !== parent) return;
  if (ev.data?.type === 'params') {
    if(PREVIEW) previewDraft={...ev.data.params};
    receiveParams(ev.data.params);
  }
});

let lockedBase = null;   // latest server baseline; P25 follows with tau=60s

function baseHeart(stats) {
  if (lockedBase != null) return lockedBase;
  return P.baseFallback;
}

// 强度 0..1：B 为 0，满红阈值 R 为 1
function intensityOf(bpm, anchors) {
  if (bpm == null || !anchors) return 0;
  return Math.max(0, Math.min(1, (bpm - anchors.B) / Math.max(1, anchors.R - anchors.B)));
}

// 强度 → 颜色：0 白 · yellowAt 黄 · orangeAt 橙 · 1 红
function colorOfIntensity(p) {
  const q = Math.max(0, p);
  const y = P.yellowAt, o = P.orangeAt;
  if (q <= y) return mixColor('#ffffff', '#ffe066', q / Math.max(0.05, y));
  if (q <= o) return mixColor('#ffe066', '#ffa53a', (q - y) / Math.max(0.05, o - y));
  return mixColor('#ffa53a', '#ff3b30', Math.min(1, (q - o) / Math.max(0.05, 1 - o)));
}

const algo = {
  anchors: null,      // { B, R }
  pSmooth: 0,         // 平滑后的强度
  redSince: null,     // 满红迟滞计时
  fullyRed: false,
  burst: 0,           // 特效强度
  lastBurstAt: -999,
  track: [],          // 涨幅观察窗口
};

function updateAlgo(bpm, stats, recent, dt, offline) {
  const now = performance.now() / 1000;

  // 1) 锚点：R 缓慢跟随，防突然跳变
  const B = baseHeart(stats);
  const p90 = (recent && recent.p90 != null) ? recent.p90 : B + P.minGap;
  const rTarget = Math.min(B + P.maxGap, Math.max(B + P.minGap, p90 - P.p90Offset));
  if (!algo.anchors) {
    algo.anchors = { B, R: rTarget };
  } else {
    algo.anchors.B = B;
    algo.anchors.R += (rTarget - algo.anchors.R) * (1 - Math.exp(-dt / P.anchorTau));
  }

  // 2) 强度 + Attack / Release（上色快、褪色慢）
  const live = (bpm != null) && !offline;
  const pTarget = live ? intensityOf(bpm, algo.anchors) : 0;
  const tau = pTarget > algo.pSmooth ? P.attack : P.release;
  algo.pSmooth += (pTarget - algo.pSmooth) * (1 - Math.exp(-dt / Math.max(0.05, tau)));

  // 3) 满红迟滞（Schmitt）
  const R = algo.anchors.R;
  if (live && bpm >= R) {
    if (algo.redSince == null) algo.redSince = now;
    if (now - algo.redSince >= P.redHold) algo.fullyRed = true;
  } else if (!live || bpm < R - P.redDrop) {
    algo.redSince = null;
    algo.fullyRed = false;
  }

  // 4) 突发特效（与颜色通道独立）+ 冷却
  if (live) {
    algo.track.push([now, bpm]);
    while (algo.track.length && now - algo.track[0][0] > P.burstWindow) algo.track.shift();
    const rise = bpm - algo.track[0][1];
    if (rise >= P.burstRise && bpm >= B + P.burstAbove
        && now - algo.lastBurstAt >= P.burstCooldown) {
      algo.burst = 1.0;
      algo.lastBurstAt = now;
    }
  } else {
    algo.track.length = 0;
  }
  algo.burst = Math.max(0, algo.burst - dt * 1.1);   // 约 0.9 秒衰减完

  return algo;
}

/* ---------- 心率线：横穿画面中央 ---------- */

function drawTrace(samples, centerY, amp) {
  if (!samples || samples.length < 2) return;

  // 3 点移动平均压掉毛刺，然后让曲线把整个高度用满（不再留 10bpm 的死区）
  const vals = samples.map(s => s[1]);
  const smooth = vals.map((v, i) => {
    const a = vals[Math.max(0, i - 1)], b = vals[Math.min(vals.length - 1, i + 1)];
    return (a + v + b) / 3;
  });
  const lo0 = Math.min(...smooth), hi0 = Math.max(...smooth);
  const mid = (lo0 + hi0) / 2;
  const span = Math.max(3, hi0 - lo0);       // 只有几乎完全平直时才兜底
  const lo = mid - span / 2, hi = mid + span / 2;

  const total = samples[samples.length - 1][0] || 1;
  const windowSec = 90;
  const t0 = Math.max(0, total - windowSec);
  const cyc = Math.max(15, (total - t0) || windowSec);
  const x0 = 1, x1 = W - 1;          // 整条横穿（包含鱼身位置）

  const yOf = v => centerY - ((v - (lo + hi) / 2) / (span / 2)) * amp;

  const pts = [];
  samples.forEach(([t], i) => {
    if (t < t0) return;                     // forEach 里要用 return，不能用 continue
    pts.push([x0 + ((t - t0) / cyc) * (x1 - x0), yOf(smooth[i])]);
  });
  if (pts.length < 2) return;

  // 外侧暗描边 + 主红线（半透明：盖过鱼身也不挡视野）
  ctx.lineJoin = 'miter';
  ctx.lineCap = 'butt';
  ctx.globalAlpha = 0.50;
  ctx.strokeStyle = PAL.traceDim;
  ctx.lineWidth = Math.max(3, Math.round(H * 0.055));
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (const [x, y] of pts.slice(1)) ctx.lineTo(x, y);
  ctx.stroke();

  ctx.globalAlpha = 0.88;
  ctx.strokeStyle = PAL.trace;
  ctx.lineWidth = Math.max(2, Math.round(H * 0.036));
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (const [x, y] of pts.slice(1)) ctx.lineTo(x, y);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // 最右端的心跳亮点
  const [lx, ly] = pts[pts.length - 1];
  const dot = Math.max(2, Math.round(H * 0.028));
  px(lx - dot, ly - dot, dot * 2, dot * 2, '#ffffff');
}

/* ---------- 像素咸鱼 ---------- */

/* =========================================================
   皮肤系统
   每套皮肤 = 一个像素网格（行字符串）+ 一个绘制函数。
   字符约定：. 透明 · # 身体 · E 眼睛 · T 舌头
   ========================================================= */

const SKIN_DEFS = {
  fish:   { w: 18, h: 13 },
  ghost:  { w: 14, h: 14 },
  xianyu: { w: 24, h: 16 }, // reserve the widest material frame
};

const XIANYU_IMAGES = {};
const XIANYU_SPRITES = {};
let spriteError = '';
let xianyuBakedEffects = false;
fetch('/assets/skins/xianyu/frames.json').then(r=>{if(!r.ok)throw Error('皮肤配置未加载');return r.json()}).then(meta=>{
  xianyuBakedEffects = meta.baked_effects === true;
  Object.entries(meta.frames).forEach(([name,def])=>{
    const img=new Image();XIANYU_IMAGES[name]=img;
    img.onload=()=>{
      const sprite=document.createElement('canvas');
      [sprite.width,sprite.height]=meta.canvas;
      sprite.getContext('2d').drawImage(img,meta.anchor[0]-def.anchor[0],meta.anchor[1]-def.anchor[1]);
      XIANYU_SPRITES[name]=sprite;
    };
    img.onerror=()=>{spriteError='皮肤素材加载失败：'+name};
    img.src='/assets/skins/xianyu/'+name+'.png';
  });
}).catch(e=>{spriteError=e.message});

/* ---------- 幽灵：白色圆顶 + 黑描边 + 红舌头 + 三瓣波浪底 ---------- */
const GHOST_ROWS = [
  '.....####.....',
  '...########...',
  '..##########..',
  '.############.',
  '##############',
  '##EE######EE##',
  '##############',
  '######TT######',
  '######TT######',
  '######TT######',
  '##############',
  '##############',
  '####..##..####',
  '####..##..####',
];

function pixelShape(ox, oy, unit, rows, colors) {
  const h = rows.length, w = rows[0].length;
  // 1) 填充（宽高各 +1：消除相邻像素块之间的抗锯齿缝隙）
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      const ch = rows[r][c];
      if (ch === '.') continue;
      px(ox + c * unit, oy + r * unit, unit + 1, unit + 1, colors[ch] || colors['#']);
    }
  }
  // 2) 只在外侧描边（邻居透明才画），这样自动得到干净的轮廓
  const t = Math.max(1, Math.round(unit * 0.26));
  for (let r = 0; r < h; r++) {
    for (let c = 0; c < w; c++) {
      if (rows[r][c] === '.') continue;
      const up = r > 0 ? rows[r - 1][c] : '.';
      const dn = r < h - 1 ? rows[r + 1][c] : '.';
      const lf = c > 0 ? rows[r][c - 1] : '.';
      const rt = c < w - 1 ? rows[r][c + 1] : '.';
      const X = ox + c * unit, Y = oy + r * unit;
      if (up === '.') px(X, Y, unit, t, colors.line);
      if (dn === '.') px(X, Y + unit - t, unit, t, colors.line);
      if (lf === '.') px(X, Y, t, unit, colors.line);
      if (rt === '.') px(X + unit - t, Y, t, unit, colors.line);
    }
  }
}

function drawGhost(ox, oy, unit, opts) {
  const { beat, sleeping, flush = 0, burst = 0 } = opts;
  // 和鱼共用同一套情绪：冷静偏冷白，激动转暖红
  const body = sleeping ? '#aeb4c0' : mixColor('#f4f6fa', '#ff9b8a', flush);
  const eye = sleeping ? '#7c8492' : '#1a1d24';
  const tongue = sleeping ? '#7c8492' : '#ff3b30';

  // 幽灵是飘着的：平时缓慢上下浮动，爆发时蹿得更明显
  const float = Math.sin(beat * Math.PI * 2) * unit * (0.30 + burst * 0.75);

  pixelShape(ox, oy + float, unit, GHOST_ROWS, {
    '#': body, 'E': eye, 'T': tongue, line: '#2b2f36',
  });
}

/* 按当前皮肤分发 */
function drawCharacter(x, y, unit, opts) {
  if (P.skin === 'ghost') return drawGhost(x, y, unit*(opts.scale ?? P.fishScale), opts);
  if (P.skin === 'xianyu') return drawXianyu(x, y, unit, opts);
  return drawFish(x, y, unit*(opts.scale ?? P.fishScale), opts);
}

const FISH_W = 18, FISH_H = 13;
const CGX = 7.2, CGY = 6.4, RX = 6.6, RY = 4.6;

// 咸鱼突刺皮肤的表现层；保留现有 BPM / P90 / burst 算法与全部原皮肤。
const XIANYU_FX = { warmth: true, kick: true }; // 已移除红色脉冲光
const XIANYU_TINT = document.createElement('canvas');
const XIANYU_TINT_CTX = XIANYU_TINT.getContext('2d');
let lastXianyuFrame = 'idle';
let lastSpriteGeometry=null;
const clamp01 = n => Math.min(1, Math.max(0, n));
const smooth01 = n => { const x = clamp01(n); return x * x * (3 - 2 * x); };

// 每个心跳周期一次：迅速上弹，约半个周期内缓慢回位。
// 相位仍取自 bpm / 60，未修改真正的心率采样与平滑算法。
function xianyuBeatKick(beat) {
  const p = ((beat % 1) + 1) % 1;
  if (p < 0.12) return 1 - Math.pow(1 - p / 0.12, 3);
  if (p < 0.52) return Math.pow(1 - (p - 0.12) / 0.40, 2);
  return 0;
}

// Absolute bpm difference; the Schmitt band is independent of the moving R anchor.
const XIANYU_STAGES = ['idle','alert_low','alert_mid','tense','high','charge'];
const STAGE_BOUNDS = [4,8,12,16,20];
let xianyuStageIndex = 0;
let demoForcedStage = null;
let demoForcedFrame = null;
function xianyuStage(delta, sleeping=false) {
  if (sleeping || !Number.isFinite(delta)) { xianyuStageIndex = 0; return 'idle'; }
  while (xianyuStageIndex < 5 && delta >= STAGE_BOUNDS[xianyuStageIndex] + 2) xianyuStageIndex++;
  while (xianyuStageIndex > 0 && delta < STAGE_BOUNDS[xianyuStageIndex-1] - 2) xianyuStageIndex--;
  return XIANYU_STAGES[xianyuStageIndex];
}
function drawXianyu(ox, oy, unit, opts) {
  const {beat, sleeping, flush = 0, burst = 0} = opts;
  // 突刺独立于常态：先 thrust，后 recover；结束后恢复当前心率档位。
  let frame = !DEMO && !TEST_MODE && Number.isInteger(state.visual_stage)
    ? XIANYU_STAGES[state.visual_stage] : xianyuStage(opts.bpm - (algo.anchors?.B ?? P.baseFallback), sleeping);
  if(sleeping)frame='idle';
  if (DEMO_CONTROLLED && demoForcedStage !== null) frame = XIANYU_STAGES[demoForcedStage];
  if(DEMO_CONTROLLED && demoForcedFrame && !sleeping) frame=demoForcedFrame;
  else if (!sleeping && burst > 0.30) frame = 'burst';
  else if (!sleeping && burst > 0.08) frame = 'recover';
  lastXianyuFrame = frame;
  // One shared virtual canvas/body anchor for every frame. Never scale with beat/burst.
  const scaled=scaledSpriteSet.images[frame];
  const exact=opts.rect&&scaled?.complete&&scaled.naturalWidth===opts.rect[2]&&scaled.naturalHeight===opts.rect[3];
  const img = exact ? scaled : XIANYU_SPRITES[frame] || XIANYU_SPRITES.idle;
  if (!img) return;
  const dh = opts.rect ? opts.rect[3] : Math.round(SKIN_DEFS.xianyu.h * unit * (opts.scale ?? P.fishScale));
  const dw = opts.rect ? opts.rect[2] : Math.round(dh * 1.5 * P.fishWidth);
  const heat = sleeping ? 0 : smooth01((flush - .25)/.70);
  const kick = !sleeping && XIANYU_FX.kick ? xianyuBeatKick(beat) : 0;
  const bob = -Math.round(kick * Math.max(1,unit*.25));
  const dx = opts.rect ? opts.rect[0]+Math.round(burst*unit*3) : Math.round(ox+SKIN_DEFS.xianyu.w*unit/2-dw/2);
  const dy = opts.rect ? opts.rect[1]+bob : Math.round(oy+SKIN_DEFS.xianyu.h*unit/2-dh/2+bob);
  let sprite=img;
  const tint=XIANYU_FX.warmth && !sleeping ? heat*.24+burst*.06 : 0;
  if(tint>.005 && XIANYU_TINT_CTX){
    if(XIANYU_TINT.width!==dw||XIANYU_TINT.height!==dh){XIANYU_TINT.width=dw;XIANYU_TINT.height=dh}
    XIANYU_TINT_CTX.clearRect(0,0,dw,dh);
    XIANYU_TINT_CTX.imageSmoothingEnabled=false;
    XIANYU_TINT_CTX.drawImage(img,0,0,dw,dh);
    XIANYU_TINT_CTX.globalCompositeOperation='source-atop';
    XIANYU_TINT_CTX.fillStyle=`rgba(255,51,43,${Math.min(.3,tint)})`;
    XIANYU_TINT_CTX.fillRect(0,0,dw,dh);
    XIANYU_TINT_CTX.globalCompositeOperation='source-over';
    sprite=XIANYU_TINT;
  }
  lastSpriteGeometry={frame,width:dw,height:dh,x:dx,y:dy,bob};
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sprite, dx, dy, dw, dh);
  ctx.restore();
}

function drawFish(ox, oy, unit, opts) {
  const { zone, beat, sleeping, bpm, flush = 0, burst = 0 } = opts;
  const bodyColor = mixColor(PAL.body, '#ff9b8a', flush);
  const shadeColor = mixColor(PAL.shade, '#d4553f', flush);
  const lineColor = PAL.line;

  const vigor = 0.75 + flush * 0.5 + burst * 0.7;   // 心率越高 / 爆发时，突刺越有劲
  const thrust = sleeping ? 0 : (Math.max(0, Math.sin(beat * Math.PI * 2)) ** 3) * vigor;
  const jitter = zone === 'danger' ? (Math.sin(performance.now() / 40) * unit * 0.3) : 0;
  const sx = ox + thrust * unit * 1.2 * (1-burst) + jitter * (1-burst);
  const sy = oy + thrust * unit * 0.25 * (1-burst);
  const g = (gx, gy) => [sx + gx * unit, sy + gy * unit];
  const inside = (a, b) => {
    const nx = (a - CGX) / RX, ny = (b - CGY) / RY;
    return nx * nx + ny * ny <= 1.0;
  };

  // ---- 小矛（先画，鱼身会盖住中段）----
  const hotSpear = !sleeping && (zone === 'warn' || zone === 'danger');
  const SP_BX = 0.5, SP_BY = 14.5, SP_N = 24, SP_DX = 0.55, SP_DY = -0.55;
  for (let i = 0; i < SP_N; i++) {
    const [x, y] = g(SP_BX + i * SP_DX, SP_BY + i * SP_DY);
    px(x, y, unit, unit, '#7a4a1e');
    px(x, y + unit * 0.72, unit, unit * 0.28, '#4d2d10');
  }
  const hx = SP_BX + SP_N * SP_DX, hy = SP_BY + SP_N * SP_DY;
  { const [x, y] = g(hx - 0.62, hy + 0.30); px(x, y, unit * 0.9, unit * 0.9, '#aeb8c2'); }
  { const [x, y] = g(hx + 0.30, hy - 1.18); px(x, y, unit * 0.9, unit * 0.9, '#aeb8c2'); }
  const HEAD = [[0.00, 0.00, 1.00, '#cfd8e2'], [0.60, -0.60, 1.00, '#e4ebf3'],
                [1.20, -1.20, 0.85, '#f6faff'], [1.80, -1.80, 0.60, hotSpear ? '#ffe9a8' : '#ffffff']];
  for (const [dx, dy, sc, col] of HEAD) {
    const [x, y] = g(hx + dx, hy + dy);
    px(x, y, unit * sc, unit * sc, col);
  }
  // 令旗
  const fWave = Math.sin(beat * Math.PI * 2) * 0.18;
  const FLAG = hotSpear ? '#ff5a5a' : '#d43232';
  { const [x, y] = g(hx + 0.55, hy - 1.95 + fWave); px(x, y, unit * 1.6, unit * 1.5, FLAG); }
  { const [x, y] = g(hx + 1.75, hy - 1.72 + fWave); px(x, y, unit * 1.5, unit * 1.4, FLAG); }
  { const [x, y] = g(hx + 2.90, hy - 1.50 + fWave); px(x, y, unit * 1.2, unit * 1.1, '#8e1f1f'); }

  // ---- 鱼身 ----
  for (let gy = 0; gy < FISH_H; gy++) {
    for (let gx = 0; gx < FISH_W; gx++) {
      const d = ((gx - CGX) / RX) ** 2 + ((gy - CGY) / RY) ** 2;
      if (d > 1.0) continue;
      const [x, y] = g(gx, gy);
      let col = bodyColor;
      if (d > 0.72) col = shadeColor;
      else if (gy <= CGY - 2 && gx < CGX + 2) col = PAL.bodyHi;
      px(x, y, unit, unit, col);
    }
  }
  for (let gy = 0; gy < FISH_H; gy++) {
    for (let gx = 0; gx < FISH_W; gx++) {
      if (inside(gx, gy)) continue;
      if (inside(gx - 1, gy) || inside(gx + 1, gy) || inside(gx, gy - 1) || inside(gx, gy + 1)) {
        const [x, y] = g(gx, gy);
        px(x, y, unit, unit, lineColor);
      }
    }
  }
  // 尾 / 鳍
  for (const [gx, top, hgt] of [[13.4, 5, 3], [14.4, 4, 5], [15.4, 3, 7], [16.4, 2, 9]]) {
    for (let i = 0; i < hgt; i++) {
      const [x, y] = g(gx, top + i);
      px(x, y, unit, unit, (i === 0 || i === hgt - 1) ? lineColor : PAL.fin);
    }
  }
  for (let i = 0; i < 3; i++) {
    const [x, y] = g(6 + i, 2 - i * 0.4);
    px(x, y, unit, unit, i === 2 ? lineColor : PAL.fin);
  }
  // 眼睛 / 嘴 / 腮
  const [ex, ey] = g(3, 5);
  if (sleeping) {
    px(ex, ey + unit * 0.5, unit * 2, unit * 0.5, lineColor);
  } else {
    px(ex, ey, unit * 2, unit * 2, zone === 'danger' ? '#7a1414' : lineColor);
  }
  { const [x, y] = g(0.2, 6.6); px(x, y, unit, unit, lineColor); }
  for (let i = 0; i < 3; i++) {
    const [x, y] = g(5, 4.6 + i);
    px(x, y, unit * 0.7, unit * 0.7, shadeColor);
  }
  // 出汗（数量随心率连续增加）
  const nSweat = flush >= 0.9 ? 3 : flush >= 0.6 ? 2 : flush >= 0.3 ? 1 : 0;
  if (nSweat > 0) {
    for (let i = 0; i < nSweat; i++) {
      const ph = (beat + i / 3) % 1;
      px(sx + 4 * unit - unit * (0.6 + i * 0.7) - ph * unit * 1.5,
         sy + 1.5 * unit - ph * unit * (2.2 + i * 0.5),
         unit * (0.7 - i * 0.12), unit * (0.7 - i * 0.12), '#bfe9ff');
    }
  }
  // 睡觉的 Zzz
  if (sleeping) {
    const t = performance.now() / 1000;
    for (let i = 0; i < 3; i++) {
      const ph = (t * 0.5 + i * 0.33) % 1;
      const size = unit * (0.6 + i * 0.18);
      px(sx + (10 + i * 2.2) * unit, sy - ph * 3 * unit, size, size * 0.35, '#9fb3c8');
      px(sx + (10 + i * 2.2) * unit, sy - ph * 3 * unit, size * 0.35, size, '#9fb3c8');
    }
  }
}

/* ---------- 像素数字（带深色描边，保证亮背景上也看得清） ---------- */

function pixelText(x, y, text, dot, color, outline) {
  let cx = x;
  for (const ch of String(text)) {
    const glyph = FONT[ch] || FONT[' '];
    for (let r = 0; r < 5; r++) {
      for (let c = 0; c < 3; c++) {
        if (glyph[r][c] !== '1') continue;
        const bx = cx + c * dot, by = y + r * dot;
        if (outline) px(bx + dot * 0.34, by + dot * 0.34, dot, dot, outline);  // 投影，不糊
        px(bx, by, dot, dot, color);
      }
    }
    cx += 4 * dot;
  }
  return cx - dot;
}

function pixelTextWidth(text, dot) { return String(text).length * 4 * dot; }

/* ---------- 状态 ---------- */

let state = {
  bpm: null, connected: false, zone: 'idle',
  stats: {}, battery: null, warn: 90, danger: 100,
};
let history = { samples: [], warn: 90, danger: 100 };
let phase = 0, lastT = performance.now();

const DEMO = params.get('demo') === '1';
const DEMO_CONTROLLED = DEMO && params.get('controlled') === '1';
let demoOverrideBpm = 82;
let demoOverrideBase = 70;
let lastDemoPublish = 0;
if (DEMO_CONTROLLED) {
  window.addEventListener('message', event => {
    if (event.origin !== location.origin || event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.type !== 'fish-demo-control') return;
    if(Number.isFinite(msg.base))demoOverrideBase=Math.max(40,Math.min(150,msg.base));
    if(Object.prototype.hasOwnProperty.call(msg,'frame'))demoForcedFrame=[...XIANYU_STAGES,'burst','recover'].includes(msg.frame)?msg.frame:null;
    if (Number.isFinite(msg.bpm)) {
      demoOverrideBpm = Math.max(50, Math.min(190, Math.round(msg.bpm)));
      state.bpm = demoOverrideBpm;
      state.connected = true;
      state.base = demoOverrideBase;
      state.recent = {p90: 100, window: 600};
    }
    if (Number.isFinite(msg.fishScale)) P.fishScale = Math.min(4, Math.max(0.5, msg.fishScale));
    if (msg.effects && typeof msg.effects === 'object') {
      for (const k of Object.keys(XIANYU_FX)) {
        if (typeof msg.effects[k] === 'boolean') XIANYU_FX[k] = msg.effects[k];
      }
    }
    if (Object.prototype.hasOwnProperty.call(msg, 'stage')) {
      demoForcedStage = Number.isInteger(msg.stage) && msg.stage >= 0 && msg.stage <= 5 ? msg.stage : null;
    }
    if (msg.burst === true) {
      algo.burst = 1;
      algo.lastBurstAt = performance.now() / 1000;
    }
  });
}

if (DEMO) {
  const FIXED = parseFloat(params.get('bpm') || 'NaN');   // ?demo=1&bpm=165 可锁定心率看配色
  let demoBpm = isNaN(FIXED) ? 88 : FIXED, demoT = 0;
  let demoMax = demoBpm, demoMin = demoBpm, demoSum = 0, demoN = 0;
  setInterval(() => {
    if (DEMO_CONTROLLED) {
      demoBpm = demoOverrideBpm;
    } else if (isNaN(FIXED)) {
      demoBpm += (Math.random() - 0.5) * 6;
    } else {
      demoBpm = FIXED + (Math.random() - 0.5) * 5;
    }
    demoBpm = Math.max(55, Math.min(190, demoBpm));
    demoT += 0.7; demoN++; demoSum += demoBpm;
    demoMax = Math.max(demoMax, demoBpm);
    demoMin = Math.min(demoMin, demoBpm);
    history.samples.push([demoT, Math.round(demoBpm)]);
    if (history.samples.length > 400) history.samples.shift();
    state.bpm = Math.round(demoBpm);
    state.connected = true;
    state.stats = { min: Math.round(demoMin), max: Math.round(demoMax),
                    avg: Math.round(demoSum / demoN), samples: demoN };
    state.recent = DEMO_CONTROLLED ? {p90: 100, window: 600} :
      { min: Math.round(demoMin), max: Math.round(demoMax),
        avg: Math.round(demoSum / demoN), samples: demoN, window: 600 };
    if (DEMO_CONTROLLED) state.base = demoOverrideBase;
    state.zone = demoBpm >= state.danger ? 'danger' : demoBpm >= state.warn ? 'warn' : 'rest';
  }, 700);
} else if (params.get('test') !== '1') {
  import('/live.js').then(() => { HRLive.subscribe(snap => {
    state = snap;
    history = snap.history || {samples:[]};
    receiveParams(snap.params);
    if(previewDraft)receiveParams(previewDraft);
  }); });
}
applyUrlParams();
// Test/demo need defaults but never consume the real sensor stream.
if ((DEMO && !DEMO_CONTROLLED) || params.get('test') === '1') fetch('/params').then(r=>r.json()).then(receiveParams).catch(()=>{});

// The server and the native HUD call the exact same Python layout and PNG sampler.
let visualLayout=null,visualLayoutKey='',visualAppliedKey='',layoutRetry=0,layoutError='';
let scaledSpriteSet={key:'',images:{}};
function ensureVisualLayout(){
  const q=new URLSearchParams({width:Math.round(W),height:Math.round(H),skin:P.skin,fishScale:P.fishScale,fishWidth:P.fishWidth,traceLayout:P.traceLayout||'overlay',target:HUD_PREVIEW?'hud':'obs'});
  const key=q.toString();
  if(key!==visualLayoutKey&&performance.now()>=layoutRetry){
    visualLayoutKey=key;
    fetch('/render/layout?'+key).then(r=>{if(!r.ok)throw Error('布局加载失败');return r.json()}).then(v=>{
      if(key!==visualLayoutKey)return;
      visualLayout=v;visualAppliedKey=key;layoutRetry=0;layoutError='';
      if(v.skin==='xianyu'){
        const [, ,width,height]=v.sprite_rect,cacheKey=width+'x'+height;
        if(scaledSpriteSet.key!==cacheKey){
          scaledSpriteSet={key:cacheKey,images:{}};
          for(const name of [...XIANYU_STAGES,'burst','recover']){
            const img=new Image();scaledSpriteSet.images[name]=img;
            img.src='/render/xianyu/'+name+'.png?width='+width+'&height='+height;
            img.onerror=()=>{spriteError='统一尺寸素材加载失败：'+name};
          }
        }
      }
    }).catch(e=>{if(key===visualLayoutKey){visualLayoutKey='';layoutRetry=performance.now()+1000;layoutError=e.message}});
  }
  return visualAppliedKey===key?visualLayout:null;
}

/* ---------- 主循环 ---------- */

function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;

  const bpm = state.bpm;
  const age = state.age;
  const offline = !state.connected || (age != null && age > P.offlineAfter);
  if (!TEST_MODE) lockedBase = state.base ?? null;   // latest baseline; TEST_BASE remains local to the acceptance channel
  // 皮肤实时跟随服务端（在控制台/调参面板切换后，这里立刻就变，不用刷新）
  const a = updateAlgo(bpm, state.stats, state.recent, dt, offline);
  const live = (bpm != null) && !offline;

  if (live) phase = (phase + (bpm / 60) * dt) % 1;
  else phase = (phase + 0.18 * dt) % 1;

  const v=ensureVisualLayout();
  if(!v){if(!TEST_MODE)requestAnimationFrame(frame);return;}
  ctx.clearRect(0, 0, W, H);
  if (PREVIEW_BG) { ctx.fillStyle = '#1b1f27'; ctx.fillRect(0, 0, W, H); }

  const zone = live ? (state.zone || 'idle') : 'idle';
  const unitFish=v.unit,pad=v.pad,dot=v.dot;
  const lowerTrace=P.traceLayout==='lower';
  const centerY=v.digit_origin[1]+5*dot/2;
  drawTrace(history.samples,v.trace_y,v.trace_amp);
  const skin=SKIN_DEFS[P.skin]||SKIN_DEFS.fish;
  const characterScale=v.character_scale;
  const fishW=v.sprite_rect[2],fishX=v.fish_origin[0],fishY=v.fish_origin[1];

  // Keep speed lines inside the canvas and splashes above the trace band.
  const dashOffset = live && (P.skin === 'fish' || P.skin === 'xianyu') ? a.burst * unitFish * 3 : 0;
  if (a.burst > 0.05 && (P.skin === 'fish' || (P.skin === 'xianyu' && !xianyuBakedEffects))) {
    ctx.globalAlpha = a.burst * 0.7;
    for (let i = 1; i <= 3; i++)
      px(fishX - i * 8 * SCALE, H*.12 + i*4*SCALE, 5*SCALE, 2*SCALE, '#ff3b30');
    ctx.globalAlpha = a.burst * 0.95;
    for (let i = 0; i < 6; i++) {
      const sx = Math.min(W*.58, fishX + fishW*.65 + i*5*SCALE);
      const sy = H * (i % 2 ? .09 : .57) + (i%3)*3*SCALE;
      px(sx, sy, 3*SCALE, 3*SCALE, '#bfe9ff');
    }
    ctx.globalAlpha = 1;
  }

  // 2) 角色（鱼 / 幽灵，按皮肤切换；盖在线的上层）
  drawCharacter(fishX + dashOffset, fishY, unitFish, {
    zone, beat: phase, sleeping: !live, bpm, flush: a.pSmooth, burst: a.burst, scale: characterScale, rect: v.sprite_rect,
  });

  // 3) 数字（压在线上；离线显示 ---）
  const text = live ? String(Math.round(bpm)).padStart(3, '0') : '---';
  let color = live ? colorOfIntensity(a.pSmooth) : PAL.dim;
  if (a.fullyRed) color = mixColor(color, '#c1130c', 0.55);               // 满红：压深
  if (a.burst > 0.05) color = mixColor(color, '#ffffff', a.burst * 0.55); // 爆发瞬间提亮
  const textW = pixelTextWidth(text, dot);
  const tx = v.digit_origin[0];
  const ty = v.digit_origin[1];
  pixelText(tx, ty, text, dot, color, 'rgba(0,0,0,0.55)');

  // 4) 连接状态点（右上角，很小）
  const d = Math.max(2, Math.round(H * 0.03));
  px(W - pad - d * 2, pad, d * 2, d * 2,
     live ? PAL.cool : (offline ? '#c0392b' : PAL.hot));

  if ((DEMO_CONTROLLED || PREVIEW) && now - lastDemoPublish >= 250 && window.parent !== window) {
    lastDemoPublish = now;
    window.parent.postMessage({
      type: PREVIEW ? 'fish-preview-state' : 'fish-demo-state', bpm: live ? bpm : null,
      intensity: Number(a.pSmooth.toFixed(3)),
      burst: Number(a.burst.toFixed(3)),
      frame: P.skin==='xianyu'?lastXianyuFrame:P.skin,
      base: a.anchors ? Math.round(a.anchors.B) : null,
      red: a.anchors ? Math.round(a.anchors.R) : null,
      assetError:spriteError||layoutError, geometry:lastSpriteGeometry, layout:v,
      heartbeatHz: live ? Number((bpm / 60).toFixed(2)) : 0
    }, location.origin);
  }
  if (!TEST_MODE) requestAnimationFrame(frame); // 验收台由 testTick 驱动，防止两套 RAF 并行
}

fitCanvas();
// 启动循环在下方验收台块里（它定义 TEST_MODE，必须等那块执行完）

</script>
<script>
/* ===== 验收台通道（部署方追加，独立于上面的主脚本）=====
   仅当 URL 带 ?test=1 时生效；不带时这段完全不执行。
   协议：父页 postMessage {type:'hr'|'lock'|'noise'|'params'}，
   本页每帧回传 {type:'state', bpm, flush, burst, fullyRed, frame, B, R}。*/
const TEST_MODE = params.get('test') === '1';
let TEST_HR = null, TEST_NOISE = false, TEST_BASE = null;

// 当前会画哪一帧（与 drawXianyu 的判据保持一致，验收时看得见）
function currentFrame() {
  if (state.bpm == null || !state.connected) return 'idle(离线)';
  if (P.skin === 'xianyu') return lastXianyuFrame;
  if (algo.burst > .30) return 'burst';
  if (algo.burst > .08) return 'recover';
  return 'idle';
}

if (TEST_MODE) {
  window.addEventListener('message', ev => {
    if (ev.origin !== location.origin || ev.source !== parent) return;
    const m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'hr') TEST_HR = (m.bpm == null ? null : +m.bpm);
    else if (m.type === 'lock') { TEST_BASE = (m.bpm == null ? null : +m.bpm); lockedBase = TEST_BASE; }
    else if (m.type === 'noise') TEST_NOISE = !!m.on;
  });
}

function testTick(now) {
  // 帧时间由 frame() 自己维护（它开头会算 dt 并更新 lastT），这里不要重复扣
  if (TEST_HR != null) {
    const jitter = TEST_NOISE ? (Math.random() - 0.5) * 3 : 0;
    const v = Math.max(40, Math.min(200, TEST_HR + jitter));
    state.bpm = Math.round(v);
    state.connected = true;
    state.age = 0.1;
    state.zone = v >= state.danger ? 'danger' : (v >= state.warn ? 'warn' : 'rest');
    if (!state.stats || !state.stats.samples) {
      state.stats = { min: Math.round(v) - 4, max: Math.round(v) + 4, avg: Math.round(v), samples: 900 };
    }
    state.recent = { min: Math.round(v) - 4, max: Math.round(v) + 4, avg: Math.round(v),
                     p90: Math.round(v) + 2, p50: Math.round(v), samples: 900, window: 600 };
    // 让"开播时锁定基准"这件事在验收里可控
    if (TEST_BASE != null) lockedBase = TEST_BASE;
  }
  if (TEST_HR == null) { state.bpm = null; state.connected = false; }
  frame(now);
  drawTestOverlay();
  try {
    parent.postMessage({ type: 'state', bpm: state.bpm, flush: +algo.pSmooth.toFixed(3),
                         burst: +algo.burst.toFixed(3), fullyRed: !!algo.fullyRed,
                         frame: currentFrame(), connected: !!state.connected,
                         base: lockedBase, r: algo.anchors ? +algo.anchors.R.toFixed(1) : null,
                         b: algo.anchors ? +algo.anchors.B.toFixed(1) : null }, '*');
  } catch (_) {}
  requestAnimationFrame(testTick);
}

fitCanvas();
// 验收台模式走 testTick（自己驱动心率），普通模式走原循环；两者不能同时启动。
// 注意：这一行必须留在本块（定义 TEST_MODE 的块）里——放到主脚本会在
// const 暂时性死区里引用 TEST_MODE，直接抛 ReferenceError 导致整页不渲染。
requestAnimationFrame(TEST_MODE ? testTick : frame);

// 验收时把关键内部量画在角上（只读，不改动原布局）
function drawTestOverlay() {
  if (!TEST_MODE) return;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.font = '11px Consolas, monospace';
  ctx.textBaseline = 'top';
  const lines = [
    `bpm ${state.bpm ?? '--'}`,
    `flush ${algo.pSmooth.toFixed(2)}`,
    `burst ${algo.burst.toFixed(2)}`,
    `R ${algo.anchors ? algo.anchors.R.toFixed(0) : '--'}  B ${algo.anchors ? algo.anchors.B.toFixed(0) : '--'}`,
    `frame ${currentFrame()}`,
  ];
  lines.forEach((t, i) => {
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(W - 148, 6 + i * 14, 142, 13);
    ctx.fillStyle = '#7ef0e0';
    ctx.fillText(t, W - 144, 7 + i * 14);
  });
  ctx.restore();
}

</script>
